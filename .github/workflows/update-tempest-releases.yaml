name: Update Tempest Releases
on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * 1'

jobs:
  update-tempest-release:
    strategy:
      fail-fast: false
      matrix:
        # bobcat and dalmatian should be pinned manually on their stable/ branches: upstream recorded
        # 2023.2-last and 2024.2-last in openstack/releases but hasn't pushed the git tags, so
        # automation would fall back to the latest tempest, which no longer supports them.
        # Issue: https://github.com/canonical/snap-tempest-automation/issues/39
        release: [gazpacho, epoxy, caracal, antelope, zed, yoga, ussuri]
    uses: ./.github/workflows/update-snapcraft.yaml
    with:
      openstack-release: ${{ matrix.release }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PEM: ${{ secrets.APP_PEM }}

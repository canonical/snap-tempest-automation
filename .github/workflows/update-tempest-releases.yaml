name: Update Tempest Releases
on:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * 1'

jobs:
  update-tempest-release:
    strategy:
      fail-fast: false
      matrix:
        # bobcat should be pinned manually on stable/bobcat: upstream hasn't tagged bobcat-last
        # or 2023.2-last, so automation would fall back to the latest tempest, which no longer
        # supports it.
        release: [gazpacho, epoxy, dalmatian, caracal, antelope, zed, yoga, ussuri]
    uses: ./.github/workflows/update-snapcraft.yaml
    with:
      openstack-release: ${{ matrix.release }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PEM: ${{ secrets.APP_PEM }}
